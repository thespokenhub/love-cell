name: Claude

# Feedback sent from the app opens an issue that mentions @claude.
# Claude Code makes the change on a new branch, and Vercel builds a preview of it.
# Only the repository owner and collaborators can start it, so strangers can't run it on a public repo.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: >
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these as a repository secret (Settings › Secrets and variables › Actions).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(npm --prefix app:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
